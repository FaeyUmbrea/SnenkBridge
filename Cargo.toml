[package]
name = "snenk_bridge_ui"
version = "1.2.1"
edition = "2021"

[dependencies]
log = "0.4.34"
log4rs = "1.4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
pest = "2.9.2"
pest_derive = "2.9.2"
tungstenite = "0.30.0"
rfd = "0.17.2"
tauri = { version = "2", features = [] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
