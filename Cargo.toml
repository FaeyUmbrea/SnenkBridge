[package]
name = "snenk_bridge_ui"
version = "0.3.1"
edition = "2021"

[dependencies]
log = "0.4.34"
log4rs = "1.4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
evalexpr = "13.1.0"
tungstenite = "0.30.0"
rfd = "0.17.2"
slint = { version = "1.18.0"}
dirs = "7.0.0"
gltf = { version = "1.4", features = ["extras", "names"] }
wgpu = "30.0.1"
bytemuck = { version = "1.25", features = ["derive"] }
pollster = "1.0.1"
glam = "0.33.6"

[build-dependencies]
slint-build = "1.18.0"
serde_json = "1.0.151"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0.11"

[dev-dependencies]
tempfile = "3"
