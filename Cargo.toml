[package]
name = "snenk_bridge"
version = "0.3.0"
edition = "2021"

[workspace]
members = ["ui", "service"]
# The `snenk_bridge` CLI (this root package) is not part of the default build
# output — only the UI ships. Build it explicitly with `-p snenk_bridge`.
default-members = ["ui"]

[dependencies]
snenk_bridge_service = { path = "./service" }
clap = { version = "4.5.16", features = ["derive"] }
log = "0.4.22"
log4rs = "1.3.0"
serde_json = "1.0.128"
