[package]
name = "snenk_bridge_ui"
version = "0.3.1"
edition = "2021"

[dependencies]
log = "0.4.22"
log4rs = "1.3.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
evalexpr = "=11.3.1"
tungstenite = "0.24"
rfd = "0.17.2"
slint = { version = "1.18.0", default-features = false, features = ["backend-winit", "renderer-skia", "compat-1-2"] }
dirs = "7.0.0"
gltf = { version = "1.4", features = ["extras", "names"] }
wgpu = "30.0.1"
bytemuck = { version = "1.25", features = ["derive"] }
pollster = "1.0.1"
glam = "0.33.6"

[build-dependencies]
slint-build = "1.18.0"
serde_json = "1.0.151"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "1.3"

[dev-dependencies]
tempfile = "3"
