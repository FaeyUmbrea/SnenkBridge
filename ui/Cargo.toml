[package]
name = "snenk_bridge_ui"
version = "0.3.1"
edition = "2021"

[dependencies]
snenk_bridge_service = { path = "../service" }
log = "0.4.22"
log4rs = "1.3.0"
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.128"
slint = { version = "1.18.0", default-features = false, features = ["backend-winit", "renderer-skia", "compat-1-2"] }
rfd = "0.17.2"
dirs = "7.0.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
gltf = { version = "1.4", features = ["extras", "names"] }
wgpu = "30.0.1"
bytemuck = { version = "1.25", features = ["derive"] }
pollster = "1.0.1"
glam = "0.33.6"

[build-dependencies]
slint-build = "1.18.0"
serde_json = "1.0.151"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "1.3"
